<div class="contenedor">
    
    <div class="cabecera">
        <h2>Crear Tipo de Documento</h2>
    </div>

    <div class="Formulario">
        
        <div class="campo">
            <label>Tipo de Documento</label>
            <input type="text" pInputText [(ngModel)]="nuevoTipo.tipo" />
        </div>

        <div class="campo">
            <label>Abreviatura</label>
            <input type="text" pInputText [(ngModel)]="nuevoTipo.abreviatura" />
        </div>

        <p-button label="Guardar Tipo de Documento" [raised]="true" severity="info" (click)="guardarTipo()"/>
    </div>

</div>
