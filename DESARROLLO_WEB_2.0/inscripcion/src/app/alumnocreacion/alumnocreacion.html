<div class="contenedor">
    
    <div class="cabecera">
        <h2>Crear Alumno</h2>
    </div>

    <div class="Formulario">
        
        <div class="campo">
            <label>Apellido Paterno</label>
            <input type="text" pInputText [(ngModel)]="nuevoAlumno.ap" />
        </div>

        <div class="campo">
            <label>Apellido Materno</label>
            <input type="text" pInputText [(ngModel)]="nuevoAlumno.am" />
        </div>

        <div class="campo">
            <label>Nombre</label>
            <input type="text" pInputText [(ngModel)]="nuevoAlumno.nombre" />
        </div>

        <div class="campo">
            <label>Tipo de Documento</label>
            <p-select [options]="tiposdocumento" [(ngModel)]="nuevoAlumno.tipo_documento" optionLabel="tipo" placeholder="Seleccione un tipo" class="w-full md:w-56" />
        </div>
        
        <div class="campo">
            <label>Numero de Documento</label>
            <input type="text" pInputText [(ngModel)]="nuevoAlumno.numero_documento" />
        </div>

        <div class="campo">
            <label>Correo</label>
            <input type="text" pInputText [(ngModel)]="nuevoAlumno.correo" />    
        </div>

        <div class="campo">
            <label>Telefono</label>
            <input type="text" pInputText [(ngModel)]="nuevoAlumno.telefono" />
        </div>

        <div class="campo">
            <label>Fecha de Nacimiento</label>
            <p-datepicker [(ngModel)]="nuevoAlumno.fechaNacimiento" />
        </div>

        <p-button label="Guardar Alumno" [raised]="true" severity="info" (click)="guardarAlumno()"/>
    </div>

</div>
